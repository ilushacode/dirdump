[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dirdump"
version = "0.1.0"
description = "Собирает дерево каталога в один файл - удобно для передачи нейросетям."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Илья", email = "iku04@yandex.ru" }]
keywords = ["cli", "llm", "context", "directory", "dump", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pathspec>=0.11",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.6",
    "tiktoken>=0.5",
]

[project.scripts]
dirdump = "dirdump.cli:main"

[project.urls]
Homepage = "https://github.com/ilushacode/dirdump"
Issues = "https://github.com/ilushacode/dirdump/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dirdump"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tiktoken.*"]
ignore_missing_imports = true